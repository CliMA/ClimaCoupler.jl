# 10-day WeatherBench / ProgEDMF control (no ML correction).
# Same Atmos checkout as the ML-correction run; leave ml_correction unset.
FLOAT_TYPE: "Float32"
albedo_model: "CouplerAlbedo"
strict_params: false
mode_name: "subseasonal"

era5_initial_condition_dir: "/glade/campaign/univ/ucit0011/cchristo/wxquest_data/initial_conditions/initial_conditions_0p25deg_dev/no_hz_stretch"
coupler_output_dir: "/glade/derecho/scratch/cchristo/coupler_runs_v2/weatherbench_10d_control_main"
initial_condition: "WeatherModel"
era5_ic_full_pressure: true
checkpoint_dt: "1000days"
dt_seaice: "50secs"
energy_check: false
h_elem: 30
dz_bottom: 30.0
z_elem: 130
z_max: 70000.0

hyperdiffusion_prandtl_number: 1.0
divergence_damping_factor: 20.0
topography_damping_factor: 1.15

microphysics_model: "0M"
atmos_config_file: "config/atmos_configs/climaatmos_progedmf.yml"
coupler_toml: ["toml/amip_progedmf.toml"]
dt: "40secs"
dt_cpl: "40secs"
vorticity_hyperdiffusion_coefficient: 0.15

orographic_gravity_wave: "raw_topo_online"

land_fraction_source: "era5"
binary_area_fraction: false

land_model: "integrated"
lai_source: "modis_monthly_climatology"

land_spun_up_ic: false
land_temperature_anomaly: "nothing"
use_land_diagnostics: false
radiation_reset_rng_seed: true
start_date: "20200101"
surface_setup: "PrescribedSurface"
atmos_progress_interval: "1days"
topo_smoothing: false
topography: "Earth"
t_end: "10days"
netcdf_output_at_levels: true
output_default_diagnostics: false
use_coupler_diagnostics: true
extra_atmos_diagnostics:
  ### daily inst (surface + model-level)
  - short_name: [tas, mslp, ta, hus, zg, ua, va, wa, pfull, clw, cli, cl, clt, pr]
    period: 1days
    reduction_time: inst
