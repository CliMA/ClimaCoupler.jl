FLOAT_TYPE: "Float32"
albedo_model: "CouplerAlbedo"
atmos_config_file: "config/atmos_configs/climaatmos_progedmf_1m.yml"
checkpoint_dt: "366days"
coupler_toml: ["toml/amip_progedmf_1m.toml"]
dt: "30secs"
dt_cpl: "30secs"
dt_rad: "600secs"
energy_check: false
h_elem: 16
land_model: "integrated"
mode_name: "amip"
radiation_reset_rng_seed: true
start_date: "20100101"
surface_setup: "PrescribedSurface"
t_end: "1200secs"
topo_smoothing: true
topography: "Earth"

# EXPERIMENT 2026-09-08: price the SGS quadrature by collapsing it to a single
# point. This CHANGES RESULTS and is not a proposed change -- it exists to put a
# reproducible number on what the nine-point quadrature costs, for the science
# question in calkit.yaml. The 7.93% previously quoted came from an untagged run
# whose evidence pointer (results/summary.json) has since been overwritten.
quadrature_order: 1
