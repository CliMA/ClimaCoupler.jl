# era5_initial_condition_dir: "/glade/campaign/univ/ucit0011/cchristo/wxquest_data/initial_conditions/initial_conditions_0p25deg_dev/logp_fix"
era5_initial_condition_dir: "/glade/campaign/univ/ucit0011/cchristo/wxquest_data/initial_conditions/initial_conditions_0p25deg_dev/no_hz"
coupler_output_dir: "/glade/derecho/scratch/cchristo/coupler_runs_v2/weatherbench"
initial_condition: "WeatherModel"
checkpoint_dt: "1000days"
# dt: "100secs"
# dt_cpl: "100secs"
# dt_seaice: "100secs"
# dt: "40secs"
# dt_cpl: "40secs"
dt: "40secs"
dt_cpl: "40secs"
dt_seaice: "50secs"
# dt: "10secs"
# dt_cpl: "10secs"
# dt_seaice: "50secs"

energy_check: false
h_elem: 30
# dz_bottom: 20.0
dz_bottom: 30.0
# h_elem: 110
# h_elem: 370
# z_elem: 100
z_elem: 130
z_max: 70000.0

divergence_damping_factor: 20.0
topography_damping_factor: 1.15
# topography_damping_factor: 1.2
### Microphysics
### 0M Microphysics ##
microphysics_model: "0M"
coupler_toml: ["toml/amip_progedmf.toml"]
### 1M Microphysics ###
# microphysics_model: "1M"
# coupler_toml: ["toml/amip_progedmf_1m.toml"]

# cloud_model: "MLCloud"

land_fraction_source: "era5"
binary_area_fraction: false

### integrated land ###
land_model: "integrated"
lai_source: "modis_monthly_climatology"

### bucket land ###
# land_model: "bucket"
# bucket_albedo_type: "map_temporal"

land_spun_up_ic: false
land_temperature_anomaly: "nothing"
use_land_diagnostics: false
radiation_reset_rng_seed: true
# start_date: "20101001"
start_date: "20200101"
surface_setup: "PrescribedSurface"
topo_smoothing: false
topography: "Earth"
# t_end: "3days"
# t_end: "10days"
t_end: "7days"
netcdf_output_at_levels: true
output_default_diagnostics: false
use_coupler_diagnostics: true
extra_atmos_diagnostics:
  # ### daily average (surface + model-level)
  - short_name: [zg, orog, tas, lwp, clt, ta, hus, ua, va, zg, cl, pfull, pr, clw, cli] #rwp, swp,  mslp, clw, cli, cl, pr, iwp,
    period: 1days
    reduction_time: average
    # weatherbench2 vars
  - short_name: [tas, mslp, ta, hus, zg, ua, va, pfull, clw, cli, cl, clt]
    period: 1days
    reduction_time: inst
