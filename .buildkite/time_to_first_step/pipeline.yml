agents:
  queue: clima
  slurm_time: 04:00:00
  modules: climacommon/2026_11_06-1.13.3

env:
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  SLURM_KILL_BAD_EXIT: 1

# Time to first step for the flagship AMIP simulation. See .buildkite/README.md.

steps:
  - label: "Time to first step: flagship AMIP, stock Julia"
    key: "ttfs_amip_stock"
    command: "bash .buildkite/time_to_first_step/measure.sh ttfs_amip_stock"
    artifact_paths:
      - "output/ttfs_amip_stock/artifacts/*"
      - "experiments/AMIP_ttfs_amip_stock/Manifest*.toml"
    env: &ttfs_env
      CLIMACOMMS_DEVICE: "CUDA"
      JULIA_NUM_PRECOMPILE_TASKS: 8
    agents:
      slurm_gpus_per_task: 1
      slurm_cpus_per_task: 8
      slurm_ntasks: 1
      slurm_mem: 30GB

  - label: "Time to first step: flagship AMIP, mimalloc"
    key: "ttfs_amip_opt"
    command: "bash .buildkite/time_to_first_step/measure.sh ttfs_amip_opt"
    artifact_paths:
      - "output/ttfs_amip_opt/artifacts/*"
      - "experiments/AMIP_ttfs_amip_opt/Manifest*.toml"
    env: *ttfs_env
    agents:
      slurm_gpus_per_task: 1
      slurm_cpus_per_task: 8
      slurm_ntasks: 1
      slurm_mem: 30GB
      # Use mimalloc for the allocator
      modules: climacommon/2026_11_06-1.13.3 mimalloc/3.6.1

  - label: "Compare Julia with mimalloc with stock Julia"
    depends_on:
      - "ttfs_amip_stock"
      - "ttfs_amip_opt"
    command: |
      buildkite-agent artifact download "output/ttfs_amip_*/artifacts/time_to_first_step.csv" .
      status=0
      julia --startup-file=no .buildkite/time_to_first_step/compare.jl output/ttfs_amip_stock/artifacts/time_to_first_step.csv output/ttfs_amip_opt/artifacts/time_to_first_step.csv comparison.md || status=$$?
      style=$$([ $$status -eq 0 ] && echo info || echo error)
      buildkite-agent annotate --style $$style --context ttfs_amip < comparison.md
      exit $$status
    artifact_paths: "comparison.md"
