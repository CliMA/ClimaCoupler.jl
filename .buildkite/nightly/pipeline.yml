agents:
  queue: clima
  #queue: central
  slurm_time: 24:00:00
  modules: climacommon/2025_05_15

env:
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  GKSwstype: 100
  SLURM_KILL_BAD_EXIT: 1
  CONFIG_PATH: "config/nightly_configs"
  BENCHMARK_CONFIG_PATH: "config/benchmark_configs"
  LONGRUN_CONFIG_PATH: "config/longrun_configs"
  # By default, packages use the main branch.
  # Use `Package@version` to pin a version.
  # Use `Package#rev` to pin a branch or commit.
  # Use `url#rev` to use a branch or commit of a fork.
  # See .buildkite/add_upstream_packages.jl.
  # If you are starting a new build using the web API, you can set the
  # UPSTREAM_PACKAGES environment variable. For example, if you pass
  # `UPSTREAM_PACKAGES="ClimaAtmos SurfaceFluxes@1.1.0", then the main branch
  # of ClimaAtmos and SurfaceFluxes v1.1.0 will be used.
  UPSTREAM_PACKAGES: "${UPSTREAM_PACKAGES:-ClimaAtmos#zs/bias-campaign ClimaCore Makie@0.24.15 ClimaTimeSteppers Thermodynamics ClimaLand SurfaceFluxes RRTMGP CloudMicrophysics#ts/bias-campaign-cm}"

timeout_in_minutes: 1440

steps:
  - label: "init :GPU:"
    key: "init_gpu_env"
    command:
      - "echo $$JULIA_DEPOT_PATH"

      # For this pipeline, use the main branches of certain upstream packages
      # see UPSTREAM_PACKAGES environment variable
      - |
        for env in AMIP CMIP; do
          echo "--- Instantiate $$env env"
          JULIA_PKG_PRECOMPILE_AUTO=0 julia --project=experiments/$$env/ -e 'using Pkg; Pkg.instantiate(;verbose=true)'
          julia --project=experiments/$$env/ .buildkite/add_upstream_packages.jl
          julia --project=experiments/$$env/ -e 'using Pkg; Pkg.resolve()'

          julia --project=experiments/$$env/ -e 'using Pkg; Pkg.precompile()'
          julia --project=experiments/$$env/ -e 'using Pkg; Pkg.status()'
        done

    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 8
      JULIA_MAX_NUM_PRECOMPILE_FILES: 50

  - wait

  - group: "Coarse AMIPs"

    steps:

      # - label: "Coarse current AMIP: progedmf + 1M + integrated land"
      #   key: "amip_progedmf_1m_land"
      #   command:
      #     - echo "--- Run simulation"
      #     - "julia --threads=3 --color=yes --project=experiments/AMIP/ experiments/AMIP/run_simulation.jl --config_file $CONFIG_PATH/amip_coarse_progedmf_1m_land.yml --job_id amip_coarse_progedmf_1m_land"
      #   artifact_paths: "output/amip_coarse_progedmf_1m_land/artifacts/*"
      #   timeout_in_minutes: 1440
      #   env:
      #     CLIMACOMMS_DEVICE: "CUDA"
      #     #CLIMACOMMS_CONTEXT: "SINGLETON"
      #   agents:
      #     slurm_gpus_per_task: 1
      #     #slurm_gres: gpu:nvidia_l40s:1
      #     slurm_cpus_per_task: 4
      #     slurm_ntasks: 1
      #     slurm_mem: 30GB
      
      - label: "Coarse current AMIP: progedmf + 1M + integrated land he 24"
        key: "amip_progedmf_1m_land_he24"
        command:
          - echo "--- Run simulation"
          - "srun julia --color=yes --project=experiments/AMIP/ experiments/AMIP/run_simulation.jl --config_file $CONFIG_PATH/amip_progedmf_1m_land_he24.yml --job_id amip_progedmf_1m_land_he24"
        artifact_paths: "output/amip_progedmf_1m_he24/artifacts/*"
        timeout_in_minutes: 1440
        env:
          CLIMACOMMS_DEVICE: "CUDA"
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_ntasks: 2
          slurm_mem: 30GB

