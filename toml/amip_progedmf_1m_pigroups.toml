type = "float"

[detr_coeff]
value = 0
type = "float"

[detr_buoy_coeff]
value = 1
type = "float"

[detr_vertdiv_coeff]
value = 0
type = "float"

[detr_massflux_vertdiv_coeff]
value = 0.3
type = "float"

[max_area_limiter_scale]
value = 0.001
type = "float"

[max_area_limiter_power]
value = 1
