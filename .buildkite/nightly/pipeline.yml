      #     - echo "--- Run simulation"
      #     - "julia --threads=3 --color=yes --project=experiments/AMIP/ experiments/AMIP/run_simulation.jl --config_file $CONFIG_PATH/amip_coarse_progedmf_land.yml --job_id amip_coarse_progedmf_land"
      #   artifact_paths: "output/amip_coarse_progedmf_land/artifacts/*"
      #   timeout_in_minutes: 840
      #   env:
