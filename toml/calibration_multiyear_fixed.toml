# Parameters held fixed for the multi-year September calibration. Layer this
# after toml/wxquest_progedmf.toml.
#
# NOT fixed here, and free in that run: cloud_fraction_eps_rel and
# cloud_fraction_steepness_scale (the only parameters that ever moved clt),
# plus q_liq, rain_autoconversion_timescale, and the rain and snow fall
# speeds.

[snow_autoconversion_timescale]
value = 1360
type = "float"

[condensation_evaporation_timescale]
value = 100
type = "float"

[sublimation_deposition_timescale]
value = 500
type = "float"

# Not in ClimaParams: reaches turbconv_params through the create_parameters
# release-params hook, which only reads it when a toml defines it. Held at
# its default; relax moved its mean only 0.13 prior sigma, so the earlier
# "identifiable" verdict rested on a spread ratio we no longer trust.
[cloud_fraction_floor_release_abs_margin]
value = 1
type = "float"

# CAVEAT. The data has never moved this: -0.06 prior sigma globally in
# vterm, -0.17 in the Southern Ocean band. It is held at 0.1 to stay
# comparable with those runs, NOT because 0.1 is supported. The ClimaParams
# baseline is 0.01, ten times slower. Worth a two-member sweep to check
# whether the choice matters at all.
[fixed_cloud_ice_terminal_velocity]
value = 0.1
type = "float"
