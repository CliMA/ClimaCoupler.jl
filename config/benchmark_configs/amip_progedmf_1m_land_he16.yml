FLOAT_TYPE: "Float32"
albedo_model: "CouplerAlbedo"
atmos_config_file: "config/atmos_configs/climaatmos_progedmf_1m.yml"
checkpoint_dt: "366days"
coupler_toml: ["toml/amip_progedmf_1m.toml"]
dt: "30secs"
dt_cpl: "30secs"
dt_rad: "600secs"
energy_check: false
h_elem: 16
land_model: "integrated"
mode_name: "amip"
radiation_reset_rng_seed: true
start_date: "20100101"
surface_setup: "PrescribedSurface"
t_end: "1200secs"
topo_smoothing: true
topography: "Earth"

# EXPERIMENT 2026-09-08: isolate the cost of the SGS quadrature order for the
# science team. Every other submodule is checked out to the SAME commit the
# baseline arm runs, so this config value is the ONLY difference between arms --
# `arms_differ_in` in results/treatment.json should name no code package.
#
# Order 2 (a 2x2 rule, 4 points) rather than 1, because reducing the order is
# the plausible proposal; order 1 is the upper bound and was measured separately
# in exp/2026-09-08-quadrature-order-1, which had the full optimisation stack on
# top and so could not isolate this.
quadrature_order: 2
