agents:
  queue: clima
  slurm_time: 15:00:00
  modules: climacommon/2025_05_15

env:
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  GKSwstype: 100
  SLURM_KILL_BAD_EXIT: 1
  CONFIG_PATH: "config/nightly_configs"
  BENCHMARK_CONFIG_PATH: "config/benchmark_configs"
  LONGRUN_CONFIG_PATH: "config/longrun_configs"
  # By default, packages use the main branch.
  # Use `Package@version` to pin a version.
  # Use `Package#rev` to pin a branch or commit.
  # Use `url#rev` to use a branch or commit of a fork.
  # See .buildkite/add_upstream_packages.jl.
  # If you are starting a new build using the web API, you can set the
  # UPSTREAM_PACKAGES environment variable. For example, if you pass
  # `UPSTREAM_PACKAGES="ClimaAtmos SurfaceFluxes@1.1.0", then the main branch
  # of ClimaAtmos and SurfaceFluxes v1.1.0 will be used.
  UPSTREAM_PACKAGES: "${UPSTREAM_PACKAGES:-ClimaAtmos ClimaCore ClimaTimeSteppers Thermodynamics ClimaLand SurfaceFluxes RRTMGP CloudMicrophysics}"
  # Set DOWNSTREAM_CI to run only the flagship AMIP when testing upstream
  # changes. Any non-empty value skips the other runs and is shown as the skip
  # reason.
  # Set NEW_T_END (e.g. "96mins") to set t_end of the coarse AMIPs and CMIP.
  # Format: <integer>secs|mins|hours|days.

timeout_in_minutes: 900

steps:
  - label: "init :GPU:"
    key: "init_gpu_env"
    command:
      - |
        if [ -n "$${NEW_T_END:-}" ]; then
          echo "--- Set t_end to $$NEW_T_END"
          bash .buildkite/nightly/set_t_end.sh "$$NEW_T_END" $$CONFIG_PATH/amip_coarse_progedmf_land.yml $$CONFIG_PATH/amip_coarse_progedmf_1m_land.yml $$LONGRUN_CONFIG_PATH/cmip_progedmf_land.yml $$BENCHMARK_CONFIG_PATH/amip_progedmf_1m_land_he16.yml
        fi
      - "echo $$JULIA_DEPOT_PATH"

      # For this pipeline, use the main branches of certain upstream packages
      # see UPSTREAM_PACKAGES environment variable
      - |
        for env in AMIP CMIP; do
          echo "--- Instantiate $$env env"
          JULIA_PKG_PRECOMPILE_AUTO=0 julia --project=experiments/$$env/ -e 'using Pkg; Pkg.instantiate(;verbose=true)'
          julia --project=experiments/$$env/ .buildkite/add_upstream_packages.jl
          julia --project=experiments/$$env/ -e 'using Pkg; Pkg.resolve()'

          julia --project=experiments/$$env/ -e 'using Pkg; Pkg.precompile()'
          julia --project=experiments/$$env/ -e 'using Pkg; Pkg.status()'
        done

    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 8
      JULIA_MAX_NUM_PRECOMPILE_FILES: 50

  - wait

  - group: "Coarse AMIPs"

    steps:
      - label: "Coarse current AMIP: progedmf + 0M + integrated land"
        key: "amip_progedmf_land"
        skip: "${DOWNSTREAM_CI:-}"
        command:
          - echo "--- Run simulation"
          - "julia --threads=3 --color=yes --project=experiments/AMIP/ experiments/AMIP/run_simulation.jl --config_file $CONFIG_PATH/amip_coarse_progedmf_land.yml --job_id amip_coarse_progedmf_land"
        artifact_paths: "output/amip_coarse_progedmf_land/artifacts/*"
        timeout_in_minutes: 900
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_ntasks: 1
          slurm_mem: 30GB

      - label: "Coarse current AMIP: progedmf + 1M + integrated land"
        key: "amip_progedmf_1m_land"
        skip: "${DOWNSTREAM_CI:-}"
        command:
          - echo "--- Run simulation"
          - "julia --threads=3 --color=yes --project=experiments/AMIP/ experiments/AMIP/run_simulation.jl --config_file $CONFIG_PATH/amip_coarse_progedmf_1m_land.yml --job_id amip_coarse_progedmf_1m_land"
        artifact_paths: "output/amip_coarse_progedmf_1m_land/artifacts/*"
        timeout_in_minutes: 900
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_ntasks: 1
          slurm_mem: 30GB

      - label: "Flagship AMIP GPU with prognostic EDMF + 1M + integrated land (16 helems)"
        key: "gpu_amip_progedmf_1M_land_he16"
        command: "srun julia --threads=3 --color=yes --project=experiments/AMIP/ experiments/AMIP/run_simulation.jl --config_file $BENCHMARK_CONFIG_PATH/amip_progedmf_1m_land_he16.yml --job_id gpu_amip_progedmf_1M_land_he16"
        artifact_paths: "output/gpu_amip_progedmf_1M_land_he16/artifacts/*"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_ntasks: 1
          slurm_mem: 16GB

  - group: "CMIP"
    skip: "${DOWNSTREAM_CI:-}"

    steps:
      # Shares its config with the longrun pipeline; edits there also affect this run
      - label: "CMIP: progedmf + 0M + integrated land"
        key: "cmip_progedmf_land"
        command:
          - echo "--- Run simulation"
          - "julia --threads=3 --color=yes --project=experiments/CMIP/ experiments/CMIP/run_simulation.jl --config_file $LONGRUN_CONFIG_PATH/cmip_progedmf_land.yml --job_id cmip_progedmf_land"
        artifact_paths: "output/cmip_progedmf_land/artifacts/*"
        timeout_in_minutes: 900
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_ntasks: 1
          slurm_mem: 32GB
