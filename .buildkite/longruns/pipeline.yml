agents:
  queue: central
  slurm_time: 30:00:00
  modules: climacommon/2025_05_15

env:
  JULIA_LOAD_PATH: "${JULIA_LOAD_PATH}:${BUILDKITE_BUILD_CHECKOUT_PATH}/.buildkite"
  OPENBLAS_NUM_THREADS: 1
  OMPI_MCA_opal_warn_on_missing_libcuda: 0
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  GKSwstype: 100
  SLURM_KILL_BAD_EXIT: 1
  CONFIG_PATH: "config/longrun_configs"

timeout_in_minutes: 1800 # 30 hours

steps:
  - label: "init clima :computer:"
    key: "init_cpu_env_clima"
    command:
      - "echo $$JULIA_DEPOT_PATH"

      - echo "--- Instantiate AMIP env"
      - "julia --project=experiments/AMIP/ -e 'using Pkg; Pkg.instantiate(;verbose=true)'"
      - "julia --project=experiments/AMIP/ -e 'using Pkg; Pkg.precompile()'"
      - "julia --project=experiments/AMIP/ -e 'using Pkg; Pkg.status()'"

      - echo "--- Instantiate CMIP env"
      - "julia --project=experiments/CMIP/ -e 'using Pkg; Pkg.instantiate(;verbose=true)'"
      - "julia --project=experiments/CMIP/ -e 'using Pkg; Pkg.precompile()'"
      - "julia --project=experiments/CMIP/ -e 'using Pkg; Pkg.status()'"

    agents:
      queue: clima
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 8
      JULIA_MAX_NUM_PRECOMPILE_FILES: 50

  - wait

  - group: "AMIP simulations"

    steps:

      - label: "GPU AMIP + ED only"
        key: "amip_edonly"
        command: "julia --color=yes --project=experiments/AMIP/ experiments/AMIP/run_simulation.jl --config_file $CONFIG_PATH/amip_edonly.yml --job_id amip_edonly"
        artifact_paths: "output/amip_edonly/artifacts/*"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_ntasks: 1
          slurm_mem: 32GB

      - label: "GPU AMIP + prog. EDMF + integrated land"
        key: "amip_progedmf_land"
        command:
          - "julia --color=yes --project=experiments/AMIP/ experiments/AMIP/run_simulation.jl --config_file $CONFIG_PATH/amip_progedmf_land.yml --job_id amip_progedmf_land"
        artifact_paths: "output/amip_progedmf_land/artifacts/*"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_ntasks: 1
          slurm_mem: 32GB

      - label: "GPU AMIP + prog. EDMF + integrated land + 2K SST"
        key: "amip_progedmf_land_p2k"
        command:
          - "julia --color=yes --project=experiments/AMIP/ experiments/AMIP/run_simulation.jl --config_file $CONFIG_PATH/amip_progedmf_land_p2k.yml --job_id amip_progedmf_land_p2k"
        artifact_paths: "output/amip_progedmf_land_p2k/artifacts/*"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_ntasks: 1
          slurm_mem: 32GB

      - label: "GPU AMIP + prog. EDMF + 1M + integrated land"
        key: "amip_progedmf_1m_land"
        command:
          - "julia --color=yes --project=experiments/AMIP/ experiments/AMIP/run_simulation.jl --config_file $CONFIG_PATH/amip_progedmf_1m_land.yml --job_id amip_progedmf_1m_land"
        artifact_paths: "output/amip_progedmf_1m_land/artifacts/*"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_ntasks: 1
          slurm_mem: 32GB


  - group: "CMIP simulations"

    steps:
      - label: "GPU CMIP: ED only + bucket"
        key: "cmip_edonly_bucket"
        command:
            - "julia --color=yes --project=experiments/CMIP experiments/CMIP/run_simulation.jl --config_file $CONFIG_PATH/cmip_edonly_bucket.yml --job_id cmip_edonly_bucket"
        artifact_paths: "output/cmip_edonly_bucket/artifacts/*"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_mem: 32GB
          slurm_gpus: 1

      - label: "GPU CMIP: ED only + integrated land"
        key: "cmip_edonly_land"
        command:
            - "julia --color=yes --project=experiments/CMIP/ experiments/CMIP/run_simulation.jl --config_file $CONFIG_PATH/cmip_edonly_land.yml --job_id cmip_edonly_land"
        artifact_paths: "output/cmip_edonly_land/artifacts/*"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_mem: 32GB
          slurm_gpus: 1

      - label: "GPU CMIP: prog. EDMF + integrated land"
        key: "cmip_progedmf_land"
        command:
            - "julia --color=yes --project=experiments/CMIP experiments/CMIP/run_simulation.jl --config_file $CONFIG_PATH/cmip_progedmf_land.yml --job_id cmip_progedmf_land"
        artifact_paths: "output/cmip_progedmf_land/artifacts/*"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_mem: 32GB
          slurm_gpus: 1

  - group: "CMIP multi-GPU scaling"

    steps:
      - label: "GPU CMIP scaling: cmip_edonly_land_he16 on 1 GPUs"
        key: "cmip_edonly_land_he16_1gpu"
        command:
            - "srun julia --color=yes --project=experiments/CMIP experiments/CMIP/run_simulation.jl --config_file $CONFIG_PATH/cmip_edonly_land_he16.yml --job_id cmip_edonly_land_he16_1gpu"
        artifact_paths: "output/cmip_edonly_land_he16_1gpu/artifacts/*"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_nodes: 1
          slurm_ntasks: 1
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_mem_per_cpu: 16GB

      - label: "GPU CMIP scaling: cmip_edonly_land_he16 on 2 GPUs"
        key: "cmip_edonly_land_he16_2gpu"
        command:
            - "srun julia --color=yes --project=experiments/CMIP experiments/CMIP/run_simulation.jl --config_file $CONFIG_PATH/cmip_edonly_land_he16.yml --job_id cmip_edonly_land_he16_2gpu"
        artifact_paths: "output/cmip_edonly_land_he16_2gpu/artifacts/*"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_nodes: 1
          slurm_ntasks: 2
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_mem_per_cpu: 16GB

      - label: "GPU CMIP scaling: cmip_edonly_land_he16 on 4 GPUs"
        key: "cmip_edonly_land_he16_4gpu"
        command:
            - "srun julia --color=yes --project=experiments/CMIP experiments/CMIP/run_simulation.jl --config_file $CONFIG_PATH/cmip_edonly_land_he16.yml --job_id cmip_edonly_land_he16_4gpu"
        artifact_paths: "output/cmip_edonly_land_he16_4gpu/artifacts/*"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_nodes: 1
          slurm_ntasks: 4
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_mem_per_cpu: 16GB

      - label: "GPU CMIP scaling: cmip_edonly_land_he30 on 4 GPUs"
        key: "cmip_edonly_land_he30_4gpu"
        command:
            - "srun julia --color=yes --project=experiments/CMIP experiments/CMIP/run_simulation.jl --config_file $CONFIG_PATH/cmip_edonly_land_he30.yml --job_id cmip_edonly_land_he30_4gpu"
        artifact_paths: "output/cmip_edonly_land_he30_4gpu/artifacts/*"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_nodes: 1
          slurm_ntasks: 4
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_mem_per_cpu: 16GB

      - label: "GPU CMIP scaling: cmip_edonly_land_he30 on 8 GPUs"
        key: "cmip_edonly_land_he30_8gpu"
        command:
            - "srun julia --color=yes --project=experiments/CMIP experiments/CMIP/run_simulation.jl --config_file $CONFIG_PATH/cmip_edonly_land_he30.yml --job_id cmip_edonly_land_he30_8gpu"
        artifact_paths: "output/cmip_edonly_land_he30_8gpu/artifacts/*"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_nodes: 2
          slurm_ntasks: 8
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_mem_per_cpu: 16GB

      - label: "GPU CMIP scaling: cmip_edonly_land_he30_half_deg on 4 GPUs"
        key: "cmip_edonly_land_he30_half_deg_4gpu"
        command:
            - "srun julia --color=yes --project=experiments/CMIP experiments/CMIP/run_simulation.jl --config_file $CONFIG_PATH/cmip_edonly_land_he30_half_deg.yml --job_id cmip_edonly_land_he30_half_deg_4gpu"
        artifact_paths: "output/cmip_edonly_land_he30_half_deg_4gpu/artifacts/*"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_nodes: 1
          slurm_ntasks: 4
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_mem_per_cpu: 16GB

      - label: "GPU CMIP scaling: cmip_edonly_land_he30_half_deg on 8 GPUs"
        key: "cmip_edonly_land_he30_half_deg_8gpu"
        command:
            - "srun julia --color=yes --project=experiments/CMIP experiments/CMIP/run_simulation.jl --config_file $CONFIG_PATH/cmip_edonly_land_he30_half_deg.yml --job_id cmip_edonly_land_he30_half_deg_8gpu"
        artifact_paths: "output/cmip_edonly_land_he30_half_deg_8gpu/artifacts/*"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          queue: clima
          slurm_nodes: 2
          slurm_ntasks: 8
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_mem_per_cpu: 16GB

  - wait

  - group: "Job analysis and reporting"


    steps:

      - label: ":bar_chart: CMIP multi-GPU scaling table"
        key: "cmip_scaling_table"
        depends_on:
          - "cmip_edonly_land_he16_1gpu"
          - "cmip_edonly_land_he16_2gpu"
          - "cmip_edonly_land_he16_4gpu"
          - "cmip_edonly_land_he30_4gpu"
          - "cmip_edonly_land_he30_8gpu"
          - "cmip_edonly_land_he30_half_deg_4gpu"
          - "cmip_edonly_land_he30_half_deg_8gpu"
        command:
          - "julia --color=yes --project=experiments/CMIP experiments/CMIP/scaling_table.jl --coupler_output_dir output cmip_edonly_land_he16_1gpu cmip_edonly_land_he16_2gpu cmip_edonly_land_he16_4gpu cmip_edonly_land_he30_4gpu cmip_edonly_land_he30_8gpu cmip_edonly_land_he30_half_deg_4gpu cmip_edonly_land_he30_half_deg_8gpu"
        artifact_paths: "output/scaling/table.txt"
        agents:
          queue: clima

      - label: ":thermometer: Cess climate sensitivity approximation from p2K runs"
        key: "cess_from_p2k"
        command:
          - "julia --color=yes --project=experiments/AMIP/ test/cess_climate_sensitivity.jl output/amip_progedmf_land output/amip_progedmf_land_p2k output/ecs_analysis"
        artifact_paths: "output/ecs_analysis/*"
        agents:
          queue: clima

      # plot job performance history
      - label: ":chart_with_downwards_trend: build history"
        command:
          - build_history main # name of branch to plot
        artifact_paths:
          - "build_history.html"
