agents:
  queue: clima
  slurm_time: 48:00:00
  modules: climacommon/2025_05_15

env:
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  GKSwstype: 100
  SLURM_KILL_BAD_EXIT: 1
  CONFIG_PATH: "config/amip_configs"
  # By default, this pipeline uses the versions of the upstream packages
  # recorded in the AMIP environment (experiments/AMIP/Manifest.toml).
  # Set UPSTREAM_PACKAGES to override them. Each entry is one of:
  #   `Package`          -> use the main branch
  #   `Package@version`  -> pin a release
  #   `Package#rev`      -> pin a branch or commit
  # If you are starting a new build using the web API, you can set the
  # UPSTREAM_PACKAGES environment variable. For example, if you pass
  # `UPSTREAM_PACKAGES="ClimaAtmos SurfaceFluxes@1.1.0"`, then the main branch
  # of ClimaAtmos and SurfaceFluxes v1.1.0 will be used.
  UPSTREAM_PACKAGES: "${UPSTREAM_PACKAGES:-CloudMicrophysics@0.39.0}"

timeout_in_minutes: 2880

steps:

  - label: "init :GPU:"
    key: "init_gpu_env"
    command:
      - "echo $$JULIA_DEPOT_PATH"

      - echo "--- Instantiate AMIP env"
      - "julia --project=experiments/AMIP/ -e 'using Pkg; Pkg.instantiate(;verbose=true)'"
      # Optionally override the versions of upstream packages,
      # see the UPSTREAM_PACKAGES environment variable
      - |
        julia --project=experiments/AMIP/ -e '
          using Pkg
          entries = split(get(ENV, "UPSTREAM_PACKAGES", ""))
          if isempty(entries)
              @info "UPSTREAM_PACKAGES is empty; using the versions in the AMIP Manifest"
          else
              Pkg.add(map(entries) do entry
                  if occursin("@", entry)
                      name, version = String.(split(entry, "@"))
                      Pkg.PackageSpec(; name, version)
                  elseif occursin("#", entry)
                      name, rev = String.(split(entry, "#"))
                      Pkg.PackageSpec(; name, rev)
                  else
                      Pkg.PackageSpec(; name = String(entry), rev = "main")
                  end
              end)
              Pkg.resolve()
          end'
      - "julia --project=experiments/AMIP/ -e 'using Pkg; Pkg.precompile()'"
      - "julia --project=experiments/AMIP/ -e 'using Pkg; Pkg.status()'"

    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 8
      JULIA_MAX_NUM_PRECOMPILE_FILES: 50

  - wait

  - group: "AMIP"

    steps:

      - label: "Current AMIP: progedmf + 1M + integrated land"
        key: "amip"
        command:
          - echo "--- Run simulation"
          - "srun --cpu-bind=threads --cpus-per-task=4 julia --threads=3 --color=yes --project=experiments/AMIP/ experiments/AMIP/run_simulation.jl --config_file $CONFIG_PATH/amip.yml --job_id amip"
        artifact_paths: "output/amip/artifacts/*"
        timeout_in_minutes: 2880
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_gpus_per_task: 1
          slurm_cpus_per_task: 4
          slurm_ntasks: 1
          slurm_mem: 30GB

  - wait

  - group: "Job analysis and reporting"

    steps:

      - label: "Send simulation output to Azure VM for visualization"
        command:
          # Exclude restart checkpoints (*.hdf5): ClimaViz/ClimaAnalysis only read the
          # NetCDF diagnostics, and the checkpoints (~2.4 GB/run) otherwise fill the VM's
          # 16 GB ephemeral disk. They remain written/kept on the cluster for restarts.
          - rsync -avz --exclude='*.hdf5' output/amip/output_active/* azure-arenchon:/home/arenchon/GitHub/ClimaViz.jl/data/climacoupler-amip/

      - label: ":envelope: Slack report: current AMIP"
        command:
          - |
            find output/amip/artifacts/ -type f -name 'bias*.png' -print0 | while IFS= read -r -d '' file; do
              slack-upload -c C04S6MBSDC4 -f "$$file" -n "$$(basename "$$file" .png)" -x "$$(basename "$$file" .png)"
            done
