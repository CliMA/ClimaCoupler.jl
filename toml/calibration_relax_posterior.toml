# Cloud-fraction shape and phase-relaxation parameters held at the
# lwp_clt_swcre_5d_relax posterior (job 6961043, 2026-07-30), rounded.
# Layer this file after the run's base coupler toml so these values win.
# The relax posterior also gave rain_tau 1167 and q_liq 1.93e-4; those two
# stay free where this file is used.

[snow_autoconversion_timescale]
value = 1360
type = "float"

[condensation_evaporation_timescale]
value = 100
type = "float"

# Not in ClimaParams: reaches turbconv_params through the create_parameters
# release-params hook, which only reads it when a toml defines it.
[cloud_fraction_floor_release_abs_margin]
value = 1
type = "float"

[cloud_fraction_eps_rel]
value = 0.05
type = "float"

[cloud_fraction_steepness_scale]
value = 0.55
type = "float"
