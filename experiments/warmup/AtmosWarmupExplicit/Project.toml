[compat]
# PrecompileTools 1.2 does not cache externally-owned code on Julia >= 1.12: it collects
# inference roots and calls `precompile`, while 1.3 uses `jl_tag_newly_inferred_*`, which
# is what marks another package's CodeInstances for serialization. Measured on Julia
# 1.13.3: 1500 externally-owned specializations gave a 0.02 MiB image under 1.2.1 and
# 143.55 MiB under 1.3.4. Everything this directory caches is externally owned.
PrecompileTools = "1.3"
